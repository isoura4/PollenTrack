name: Build IPA

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    name: Build & export IPA
    runs-on: macos-15          # Xcode 26 / Swift 6

    permissions:
      contents: read

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Select Xcode version ─────────────────────────────────────────────────
      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"

      # ── Build (unsigned) ─────────────────────────────────────────────────────
      # Builds an unsigned archive; no signing certificate is required in CI.
      # The resulting IPA can be installed directly on iOS 26 without a
      # signing server — use SideStore or drag-and-drop install via
      # Finder / Apple Devices on macOS.
      - name: Build archive (unsigned)
        run: |
          xcodebuild archive \
            -project PollenTrack.xcodeproj \
            -scheme PollenTrack \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/PollenTrack.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      # ── Package unsigned .app as .ipa ────────────────────────────────────────
      # Creates a minimal IPA from the unsigned build.  On iOS 26 this IPA
      # can be sideloaded directly via SideStore — no signing server required.
      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/PollenTrack.xcarchive" \
            -name "*.app" -maxdepth 4 | head -1)
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
          cd "$RUNNER_TEMP"
          zip -r PollenTrack.ipa Payload

      # ── Upload artifact ──────────────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PollenTrack-${{ github.sha }}
          path: ${{ runner.temp }}/PollenTrack.ipa
          retention-days: 30
